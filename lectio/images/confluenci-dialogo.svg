<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" height="auto" style="background-color: #121212; border-radius: 6px;">
  <defs>
    <!-- Sutil efecto de brillo para el núcleo y conexiones -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .txt-title { font-family: 'Open Sans', Arial, sans-serif; font-size: 15px; fill: #d4af37; letter-spacing: 2px; text-anchor: middle; font-weight: 600; }
    .txt-label-bold { font-family: 'Open Sans', Arial, sans-serif; font-size: 13px; fill: #e2e2e2; font-weight: 700; letter-spacing: 0.5px; }
    .txt-label { font-family: 'Open Sans', Arial, sans-serif; font-size: 12px; fill: #aaaaaa; letter-spacing: 0.5px; }
    .line-vector { fill: none; stroke: #d4af37; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
    .box-confluencia { fill: rgba(18, 18, 18, 0.9); stroke: #d4af37; stroke-width: 2; }
  </style>

  <!-- Fondo general oscuro acorde al diseño -->
  <rect width="800" height="950" fill="#121212" />

  <!-- Título Superior -->
  <text x="400" y="55" class="txt-title">LA CONFLUENCIA DEL DIÁLOGO</text>

  <!-- Perfil Humano (Izquierda) -->
  <g transform="translate(100, 110)">
    <!-- Contornos anatómicos y cerebro simplificado -->
    <path class="line-vector" d="M150,50 C120,40 80,60 70,90 C50,90 30,110 30,140 C30,170 50,190 70,200 L70,350 C70,380 90,420 120,450 L150,480" />
    <path class="line-vector" d="M70,120 C90,100 130,100 150,120" />
    <path class="line-vector" d="M90,160 C110,140 140,150 160,180" />
    <path class="line-vector" d="M150,220 L210,220 L220,250 L190,280 L180,330 L160,400" />
    <!-- Silueta del rostro humano -->
    <path class="line-vector" d="M180,220 C195,240 215,265 210,295 C205,315 195,335 185,350 L170,410" />
  </g>

  <!-- Perfil Cibernético (Derecha) -->
  <g transform="translate(400, 110)">
    <!-- Circuitos y estructura robótica -->
    <path class="line-vector" d="M50,50 C80,40 120,60 130,90 C150,90 170,110 170,140 C170,170 150,190 130,200 L130,350 C130,380 110,420 80,450 L50,480" />
    <circle cx="90" cy="100" r="14" class="line-vector" />
    <circle cx="90" cy="100" r="4" class="line-vector" />
    <path class="line-vector" d="M104,100 L135,120 L145,170" />
    <path class="line-vector" d="M50,220 L10,220 L0,250 L30,280 L40,330 L60,400" />
    <!-- Silueta del rostro robótico -->
    <path class="line-vector" d="M20,220 C5,240 -15,265 -10,295 C-5,315 5,335 15,350 L30,410" />
  </g>

  <!-- Panel Central de Confluencia -->
  <g transform="translate(325, 230)">
    <rect x="0" y="0" width="150" height="210" rx="8" class="box-confluencia" filter="url(#glow)" />
    <!-- Haz de luz central -->
    <path d="M75,25 C95,75 55,135 75,185" fill="none" stroke="#ffe8b6" stroke-width="2.5" filter="url(#glow)" opacity="0.9" />
    <circle cx="75" cy="105" r="10" fill="#ffe8b6" filter="url(#glow)" opacity="0.8" />
  </g>

  <!-- Conectores inferiores hacia las etiquetas -->
  <path d="M400,440 L400,560" class="line-vector" />

  <!-- Etiquetas de Texto Izquierda (Humano / Empatía) -->
  <g transform="translate(130, 590)">
    <text class="txt-label-bold" x="0" y="0">RESPONSABILIDAD</text>
    <text class="txt-label-bold" x="0" y="20">COMPARTIDA</text>
    <text class="txt-label" x="0" y="50">EMPATÍA</text>
    <text class="txt-label" x="0" y="72">INTUICIÓN</text>
    
    <!-- Símbolo minimalista de mariposa -->
    <g transform="translate(25, 100)" stroke="#d4af37" stroke-width="1.2" fill="none">
      <path d="M15,0 C10,-8 0,-5 0,5 C0,15 15,15 15,5 Z" />
      <path d="M15,0 C20,-8 30,-5 30,5 C30,15 15,15 15,5 Z" />
      <line x1="15" y1="-2" x2="15" y2="12" />
    </g>
  </g>

  <!-- Etiquetas de Texto Derecha (Cibernético / Datos) -->
  <g transform="translate(500, 590)">
    <text class="txt-label-bold" x="0" y="0">ANÁLISIS DE</text>
    <text class="txt-label-bold" x="0" y="20">DATOS</text>
    <text class="txt-label" x="0" y="50">SÍNTESIS</text>
    <text class="txt-label" x="0" y="72">PROCESAMIENTO</text>
    
    <!-- Símbolo minimalista de red / nodos -->
    <g transform="translate(20, 95)" stroke="#d4af37" stroke-width="1.2" fill="none">
      <circle cx="0" cy="0" r="3" fill="#d4af37" />
      <circle cx="25" cy="-8" r="3" fill="#d4af37" />
      <circle cx="20" cy="18" r="3" fill="#d4af37" />
      <line x1="0" y1="0" x2="25" y2="-8" />
      <line x1="0" y1="0" x2="20" y2="18" />
      <line x1="25" y1="-8" x2="20" y2="18" />
    </g>
  </g>
</svg>